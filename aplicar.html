<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solicita una evaluación 1:1 con Pedro Querales. No es una compra.">
<title>Solicitar evaluación · OLDTAPE</title>
<link rel="canonical" href="https://oldtapemusic.com/aplicar.html">
<link rel="alternate" hreflang="es" href="https://oldtapemusic.com/aplicar.html">
<link rel="alternate" hreflang="en" href="https://oldtapemusic.com/aplicar.html?lang=en">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="css/cookies.css?v=20260907d">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.11.2/build/css/intlTelInput.min.css">
<link rel="stylesheet" href="css/tel.css?v=20260907d">
<link rel="stylesheet" href="css/form.css?v=20260907d">
<script src="js/analytics.js?v=20260907d"></script>
</head>
<body>
<header class="nav">
  <a href="/" aria-label="OLDTAPE — inicio">
    <picture><source type="image/webp" srcset="assets/brand/logo-oldtape-blanco.webp"><img src="assets/brand/logo-oldtape-blanco.png" alt="OLDTAPE"></picture>
  </a>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es" aria-pressed="true">ES</button>
    <span aria-hidden="true">/</span>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <a class="back" href="/" data-i18n="p.back">Volver</a>
</header>

<main class="wrap">
  <p class="eyebrow" data-i18n="p.eye">Aplicación 1:1</p>
  <h1 data-i18n="p.h1">Solicitar evaluación.</h1>
  <p class="lede" data-i18n="p.lede">Cuéntanos qué estás construyendo y qué te interesa. No es una compra: revisamos tu solicitud y te enviamos un correo con información.</p>

  <form class="pf" id="form-aplicacion" novalidate>
    <input type="hidden" name="origen" value="Formulario web">
    <input type="hidden" name="formulario" value="aplicacion-1a1">
    <input type="hidden" name="pagina" value="">

    <div class="field">
      <label for="k-nombre" data-i18n="p.f.nombre">Nombre y apellido *</label>
      <input id="k-nombre" name="nombre" type="text" autocomplete="name" required>
    </div>

    <div class="field-2">
      <div class="field">
        <label for="k-email" data-i18n="p.f.email">Email *</label>
        <input id="k-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="k-tel" data-i18n="p.f.tel">WhatsApp *</label>
        <input id="k-tel" name="telefono" type="tel" autocomplete="tel" required>
      </div>
    </div>

    <div class="field">
      <label for="k-oferta" data-i18n="p.f.oferta">¿Qué te interesa? *</label>
      <select id="k-oferta" name="oferta" required>
        <option value="" data-i18n="p.f.sel">Selecciona una opción</option>
        <option value="Track Session">Track Session</option>
        <option value="PRO90">PRO90</option>
        <option value="Impulso PRO">Impulso PRO</option>
        <option value="Grupal (lista de espera)" data-i18n="p.f.grupal">Grupal (lista de espera)</option>
      </select>
    </div>

    <div class="field">
      <label for="k-perfil" data-i18n="p.f.perfil">Perfil artístico (link)</label>
      <input id="k-perfil" name="perfil" type="url" placeholder="Spotify, Instagram, YouTube…" data-i18n-ph="p.ph.perfil">
    </div>

    <div class="field">
      <label for="k-msg" data-i18n="p.f.msg">¿Dónde estás hoy y qué quieres lograr? *</label>
      <textarea id="k-msg" name="mensaje" required placeholder="Qué estás construyendo, qué te está frenando y qué quieres conseguir." data-i18n-ph="p.ph.msg"></textarea>
    </div>

    <label class="consent">
      <input type="checkbox" name="consentimiento" required>
      <span data-i18n="p.f.consent">Acepto que Oldtape use estos datos para responder mi solicitud y darle seguimiento.</span>
    </label>

    <!-- Consentimiento de marketing: propósito propio, separado del de servicio.
         Opcional y sin marcar por defecto — no bloquea el envío. -->
    <label class="consent consent--mkt">
      <input type="checkbox" id="form-aplicacion-mkt" name="marketing" value="si">
      <span data-i18n="f.marketing">Acepto recibir correos con novedades y promociones de OldtapeMusic. Puedo darme de baja en cualquier momento. Consulta la <a href="privacidad.html" target="_blank" rel="noopener">política de privacidad</a>.</span>
    </label>

    <button class="btn" type="submit" data-i18n="p.f.submit">Enviar solicitud</button>
    <p class="form-msg" role="status" aria-live="polite"></p>
  </form>

  <p class="nota" data-i18n="p.nota">Respondemos por correo o WhatsApp. <a href="privacidad.html">Privacidad</a> · <a href="cookies.html">Cookies</a></p>
</main>

<script>
window.I18N_EN = {
  "p.back": "Back",
  "p.eye": "1:1 application",
  "p.h1": "Request an evaluation.",
  "p.lede": "Tell us what you are building and what you are interested in. This is not a purchase: we review your application and email you the information.",
  "p.f.nombre": "Full name *",
  "p.f.email": "Email *",
  "p.f.tel": "WhatsApp *",
  "p.f.oferta": "What are you interested in? *",
  "p.f.sel": "Select an option",
  "p.f.grupal": "Group (waiting list)",
  "p.f.perfil": "Artist profile (link)",
  "p.ph.perfil": "Spotify, Instagram, YouTube…",
  "p.f.msg": "Where are you today and what do you want to achieve? *",
  "p.ph.msg": "What you are building, what is holding you back and what you want to achieve.",
  "p.f.consent": "I agree that Oldtape may use this data to respond to and follow up on my application.",
  "p.f.submit": "Send application",
  "p.nota": "We reply by email or WhatsApp. <a href=\"privacidad.html?lang=en\">Privacy</a> · <a href=\"cookies.html\">Cookies</a>",
  "f.marketing": "I agree to receive emails with news and promotions from OldtapeMusic. I can unsubscribe at any time. See our <a href=\"privacidad.html?lang=en\" target=\"_blank\" rel=\"noopener\">privacy policy</a>."
};
window.I18N_META = {
  es: { title: document.title, desc: (document.querySelector('meta[name=description]')||{}).content || '' },
  en: { title: "Request an evaluation · OLDTAPE", desc: "Request a 1:1 evaluation with Pedro Querales. This is not a purchase." }
};
</script>
<script defer src="js/i18n.js?v=20260907d"></script>
<script src="js/utm.js?v=20260907d"></script>
<script defer src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.11.2/build/js/intlTelInput.min.js"></script>
<script defer src="js/tel.js?v=20260907d"></script>
<script src="js/crm.js?v=20260907d"></script>
<script src="js/cookies.js?v=20260907d"></script>
</body>
</html>
